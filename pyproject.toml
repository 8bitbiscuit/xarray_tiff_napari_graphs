[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "segmentation-comparison"
version = "0.2.0"
description = "Score segmentation runs on z-span, area profile and brightness, streaming TIFFs as virtual zarr"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    # tifffile is a module-scope import in every helper, so it is not optional
    "tifffile>=2023.1",
    # the virtual-zarr read path: obstore fetches the bytes, virtual_tiff turns
    # a TIFF's IFDs into a zarr manifest, and to_dask()/to_xarray() are on the
    # default path now rather than an extra
    "zarr>=3.0",
    "virtualizarr>=2.0",
    "virtual-tiff>=0.5",
    "obstore>=0.11",
    "obspec-utils>=0.9",
    "xarray>=2025.6",
    "dask[array]>=2024.1",
]

[project.optional-dependencies]
# ipykernel is what runs the notebooks
dev = ["pytest>=7", "ipykernel"]
# napari is imported only inside launch_viewer, so a headless kernel needs none
# of this to run everything else
viewer = ["napari[all]>=0.4.19"]

[tool.setuptools]
# Flat modules, not a package -- the `zspan` package this once pointed at was
# deleted in 3267a2b, which made `pip install -e .` fail outright.  The
# notebooks import these from the working directory; listing them here just
# makes the same imports work from anywhere.
#
# These three are the whole library.  `napari_scripts/` is deliberately absent:
# those are scripts, run as files, not modules anything imports -- each puts the
# repo root on sys.path itself so it can call into the helpers either way.
py-modules = [
    "segmentation_loading",
    "segmentation_helpers_v2",
    "segmentation_brightness_helpers",
]
